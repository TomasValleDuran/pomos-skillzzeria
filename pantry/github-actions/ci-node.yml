# 🍕 Node/TS CI — lint, typecheck, test, build. Works with npm, pnpm or yarn (auto-detected from the lockfile).
# Copy to .github/workflows/ci.yml. Steps whose package.json script is missing are skipped.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "pm=pnpm" >> "$GITHUB_OUTPUT"; echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then echo "pm=yarn" >> "$GITHUB_OUTPUT"; echo "install=yarn install --immutable" >> "$GITHUB_OUTPUT"
          else echo "pm=npm" >> "$GITHUB_OUTPUT"; echo "install=npm ci" >> "$GITHUB_OUTPUT"; fi

      - if: steps.pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v6   # reads the version from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*          # or replace with: node-version-file: .nvmrc
          cache: ${{ steps.pm.outputs.pm }}

      - run: ${{ steps.pm.outputs.install }}
      - run: ${{ steps.pm.outputs.pm }} run --if-present lint
      - run: ${{ steps.pm.outputs.pm }} run --if-present typecheck
      - run: ${{ steps.pm.outputs.pm }} run --if-present test
      - run: ${{ steps.pm.outputs.pm }} run --if-present build
