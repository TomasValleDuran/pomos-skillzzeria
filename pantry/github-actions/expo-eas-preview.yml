# 📱 Expo: publish an EAS Update for every PR and comment a QR code to open it in a dev build / Expo Go.
# Copy to .github/workflows/eas-preview.yml. Secret needed: EXPO_TOKEN (expo.dev → Access tokens).
# Requires the project to be configured for EAS Update (`eas update:configure`).
name: EAS preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: eas-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - uses: expo/expo-github-action/preview@v8
        with:
          command: eas update --auto --branch ${{ github.event.pull_request.head.ref }}
