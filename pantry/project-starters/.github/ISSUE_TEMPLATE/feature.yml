name: ✨ Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem, and when? (not the solution yet)
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: done
    attributes:
      label: How do we know it's done?
      placeholder: "- [ ] user can …"
